[project]
name = "simbolicregression"
version = "0.1.0"
description = "Decision-model-guided symbolic regression with Monte Carlo Tree Search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
symbolic-regression = "symbolic_regression.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symbolic_regression"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
